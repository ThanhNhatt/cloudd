services:

  postgres:
    image: postgres:15
    container_name: cloud
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"

  auth-services:
    build: ./auth-services
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  student-services:
    build: ./student-services
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  course-services:
    build: ./course-services
    ports:
      - "3003:3003"
    depends_on:
      - postgres

  enrollment-services:
    build: ./enrollment-services
    ports:
      - "3005:3005"
    depends_on:
      - postgres

  grade-services:
    build: ./grade-services
    ports:
      - "3004:3004"
    depends_on:
      - postgres

  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-services
      - student-services
      - course-services
      - enrollment-services
      - grade-services

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway